<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickLaunch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- ====== 顶部栏（始终可见） ====== -->
    <header class="header">
      <h1 class="title">QuickLaunch</h1>
      <div class="sys-cpu">
        <span class="sys-cpu-label">CPU</span>
        <span class="sys-cpu-value" id="systemCPU">--</span>
      </div>
      <button id="btnExportCsv" class="btn btn-outline btn-sm" title="Export CSV">CSV</button>
      <button id="btnTheme" class="btn-theme" title="Toggle theme">&#9788;</button>
    </header>

    <!-- ====== 紧凑主操作栏（始终可见） ====== -->
    <section class="toolbar">
      <div class="group-controls">
        <select id="profileSelect" class="profile-select"></select>
        <button id="btnNewGroup" class="btn btn-outline btn-sm" title="New Group">+</button>
        <button id="btnRenameGroup" class="btn btn-outline btn-sm" title="Rename">&#9998;</button>
        <button id="btnCloneGroup" class="btn btn-outline btn-sm" title="Duplicate">&#9113;</button>
        <button id="btnDelGroup" class="btn btn-outline btn-sm" title="Delete">&#10005;</button>
      </div>
      <button id="btnStartAll" class="btn btn-success">&#9654; Start All</button>
      <button id="btnStopAll" class="btn btn-danger">&#9632; Stop All</button>
      <button id="btnScanAll" class="btn btn-primary">Scan</button>
      <label class="recording-toggle" title="CSV Recording">
        <input type="checkbox" id="chkRecording" checked />
        <span>Rec</span>
      </label>
      <div class="running-count">
        <span class="count-dot" id="countDot"></span>
        <span id="countText">0 / 0</span>
      </div>
      <button id="btnToggleSettings" class="btn btn-outline btn-sm" title="Settings">&#9881;</button>
    </section>

    <!-- ====== 可折叠设置面板 ====== -->
    <section id="settingsPanel" class="settings-panel collapsed">
      <div class="settings-row">
        <label class="setting-label">Folders</label>
        <input type="text" id="folderPath" class="folder-input" placeholder="Folder path..." />
        <button id="btnBrowse" class="btn btn-outline btn-sm">Browse</button>
        <button id="btnAddFolder" class="btn btn-primary btn-sm">Add</button>
      </div>
      <div id="folderList" class="folder-list"></div>
      <div class="settings-actions">
        <button id="btnOpenLogs" class="btn btn-outline btn-sm" title="Open log folder">Logs</button>
        <span style="flex:1"></span>
        <button id="btnOpenConfig" class="btn btn-outline btn-sm" title="Import config from JSON file">Open Config</button>
        <button id="btnExportConfig" class="btn btn-outline btn-sm" title="Export config to JSON file">Export Config</button>
      </div>
    </section>

    <!-- ====== 应用列表（主区域） ====== -->
    <section class="app-section">
      <div class="app-list" id="appList">
        <div class="empty-state">
          <div class="empty-icon">NO APPS</div>
          <p>Add a folder then click Scan</p>
        </div>
      </div>
    </section>

    <!-- ====== 状态栏 ====== -->
    <footer class="status-bar">
      <span id="statusText">Ready</span>
      <span id="appCount" class="app-count">0 apps</span>
    </footer>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">Profile Name</div>
      <input id="modalInput" class="modal-input" type="text" placeholder="Enter profile name..." />
      <div class="modal-actions">
        <button id="modalCancel" class="btn">Cancel</button>
        <button id="modalConfirm" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
